# CID-SIMS Apartment 1, traversal 1. The mapper parameters are exactly the
# fixed values used for every COLD environment; only the dataset adapter and
# input paths differ.
player_executable: "cid_sims_player"

player:
  dataset_root: "/workspace/encoder"
  sequences:
    - "apartment1_1"
  color_subdir: "color"
  ground_truth_file: "groundtruth.txt"
  odometry_file: "odom.txt"
  # CID-SIMS RGB is 30 Hz. Sampling every sixth image gives approximately
  # the 5 Hz visual stream used for COLD without changing detector timing.
  frame_stride: 6
  max_ground_truth_gap_s: 0.1
  max_odometry_gap_s: 0.2
  publish_rate_hz: 50.0
  inter_sequence_pause_s: 2.0
  odometry_uncertainty: [0.025, 0.005, 0.01, 0.0025]

mapping:
  verification_threshold: 0.0
  defer_nodes: 2
  fixed_concentration: 384.0
  visual_model: "cosine"
  use_frame_labels: true
  uncertainty_contract: "path_length_budget_v1"
  descriptor_cache_dir: "output/cache/descriptors"
  window_size: 30
  valley_k: 2.0
  visual_outlier_k: 2.0
  gate_mode: "both"
  naive_threshold: 0.7
  dino_model: "dinov3_vits16"
  use_ground_truth: true
  output_dir: "output/submission/cid_sims_apartment1_1"
  run_name: "cid_sims_apartment1_1"

language:
  graph_path: "output/submission/cid_sims_apartment1_1/final_graph.pkl"
  semantic_model: "openai/clip-vit-base-patch32"
  mode: "manual"
  query_sentence: "Go to the kitchen."
  top_k: 3
  output_dir: "output/submission/cid_sims_apartment1_1/commands"
